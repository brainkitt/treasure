<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Arb</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #101216; --line: #1c1f26; --dim: #5d6370; --text: #e8eaee;
    --green: #2fd18b; --red: #ff5d73; --blue: #5b8def; --violet: #a78bfa; --amber: #e0b34a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid var(--line); letter-spacing: .14em; font-size: 12px;
  }
  header b { font-weight: 700; }
  .dim { color: var(--dim); }
  .badge { letter-spacing: .14em; }
  .badge::before { content: "●"; margin-right: 6px; }
  .badge.PAPER, .badge.SIM { color: var(--amber); }
  .badge.LIVE { color: var(--green); }
  .badge.OFFLINE { color: var(--red); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 20px; letter-spacing: .04em; }
  .meta span b { font-weight: 400; color: var(--text); }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .tile { padding: 18px 24px; border-right: 1px solid var(--line); min-width: 0; }
  .tile:last-child { border-right: 0; }
  .label { color: var(--dim); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
  .big { font-size: 34px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { color: var(--dim); font-size: 12px; }
  .pos, .strip b.pos { color: var(--green); } .neg, .strip b.neg { color: var(--red); }
  .strip {
    display: flex; flex-wrap: wrap; gap: 4px 28px; padding: 10px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel); font-variant-numeric: tabular-nums;
  }
  .strip span { color: var(--dim); white-space: nowrap; }
  .strip b { font-weight: 400; color: var(--text); margin-left: 6px; }
  .strip b.blue { color: var(--blue); } .strip b.violet { color: var(--violet); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 460px; min-height: 0; }
  .chart { padding: 18px 24px; display: flex; flex-direction: column; min-height: 320px; min-width: 0; }
  .chart .head { display: flex; justify-content: space-between; }
  .chart canvas { flex: 1; width: 100%; min-height: 0; margin-top: 10px; }
  .log { border-left: 1px solid var(--line); background: var(--panel); padding: 18px 20px; overflow-y: auto; min-height: 0; }
  .log .row { padding: 3px 0; overflow-wrap: anywhere; }
  .log .t { color: var(--dim); margin-right: 8px; }
  .k-info { color: var(--dim); } .k-signal { color: var(--blue); } .k-exec { color: var(--text); }
  .k-win { color: var(--green); font-weight: 700; } .k-loss { color: var(--red); font-weight: 700; } .k-warn { color: var(--amber); }
  .empty { color: var(--dim); padding: 20px 0; }
  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile:nth-child(2) { border-right: 0; }
    .tile:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .big { font-size: 26px; }
    main { grid-template-columns: minmax(0, 1fr); }
    .log { border-left: 0; border-top: 1px solid var(--line); max-height: 50vh; }
    header, .tile, .strip, .chart { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <div><b>POLYMARKET ARB</b> <span class="dim">// RUST ENGINE</span> &nbsp;<span id="mode" class="badge OFFLINE">CONNECTING</span></div>
  <div class="meta dim">
    <span>uptime <b id="uptime">--</b></span>
    <span>vol <b id="vol">--</b></span>
    <span id="feeds"></span>
  </div>
</header>

<section class="tiles">
  <div class="tile"><div class="label">Balance</div><div class="big" id="equity">--</div><div class="sub" id="seed">&nbsp;</div></div>
  <div class="tile"><div class="label">Total P&amp;L</div><div class="big" id="pnl">--</div><div class="sub" id="pnlpct">&nbsp;</div></div>
  <div class="tile"><div class="label">Exec latency</div><div class="big" id="lat">--</div><div class="sub" id="latsub">signal → fill</div></div>
  <div class="tile"><div class="label">Win rate</div><div class="big" id="win">--</div><div class="sub" id="wl">&nbsp;</div></div>
</section>

<section class="strip">
  <span>BTC/USD<b class="blue" id="spot">--</b></span>
  <span>strike<b id="strike">--</b></span>
  <span>CLOB mid<b id="mid">--</b></span>
  <span>fair<b id="fair">--</b></span>
  <span>edge<b class="violet" id="edge">--</b></span>
  <span>daily P&amp;L<b id="daily">--</b></span>
  <span>risk used<b id="risk">--</b></span>
  <span>fees<b id="fees">--</b></span>
  <span id="mkt"></span>
</section>

<main>
  <div class="chart">
    <div class="head"><span class="label">Equity curve // BTC arb</span><span class="dim" id="span"></span></div>
    <canvas id="c"></canvas>
  </div>
  <div class="log">
    <div class="label" style="margin-bottom:10px">Execution log</div>
    <div id="log"><div class="empty">waiting for data…</div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const usd = (x, d = 2) => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = x => (x >= 0 ? "+" : "-") + usd(Math.abs(x));
const dur = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const p = n => String(n).padStart(2, "0"); return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`; };
const cls = (el, x) => { el.classList.toggle("pos", x > 0); el.classList.toggle("neg", x < 0); };
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let last = null;

function draw(curve) {
  const c = $("c"), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  if (!curve || curve.length < 2) return;
  const padL = 62, padR = 14, padT = 12, padB = 8;
  let lo = Infinity, hi = -Infinity;
  for (const p of curve) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const m = (hi - lo) * 0.08; lo -= m; hi += m;
  const t0 = curve[0][0], t1 = curve[curve.length - 1][0];
  const X = t => padL + (w - padL - padR) * (t - t0) / Math.max(1, t1 - t0);
  const Y = v => padT + (h - padT - padB) * (1 - (v - lo) / (hi - lo));
  g.font = "11px ui-monospace, Menlo, monospace"; g.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    g.strokeStyle = "#1c1f26"; g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
    g.fillStyle = "#5d6370"; g.fillText(usd(v, hi - lo < 20 ? 2 : 0), 0, y);
  }
  g.beginPath();
  curve.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])));
  g.strokeStyle = "#5b8def"; g.lineWidth = 1.6; g.lineJoin = "round"; g.stroke();
  g.lineTo(X(t1), h - padB); g.lineTo(X(t0), h - padB); g.closePath();
  const grad = g.createLinearGradient(0, padT, 0, h);
  grad.addColorStop(0, "rgba(91,141,239,.22)"); grad.addColorStop(1, "rgba(91,141,239,0)");
  g.fillStyle = grad; g.fill();
  const e = curve[curve.length - 1];
  g.fillStyle = "#5b8def"; g.beginPath(); g.arc(X(e[0]), Y(e[1]), 3.5, 0, 6.3); g.fill();
}

function render(s) {
  last = s;
  const mode = $("mode"); mode.textContent = s.mode; mode.className = "badge " + s.mode;
  $("uptime").textContent = dur(s.now_ms - s.started_ms);
  $("vol").textContent = (s.vol_annual * 100).toFixed(0) + "% ann.";
  $("feeds").innerHTML = s.feeds.map(f => `${esc(f[0])} <b style="color:${f[1] < 0 || f[1] > 5000 ? "var(--red)" : "var(--text)"}">${f[1] < 0 ? "down" : Math.round(f[1]) + "ms"}</b>`).join(" &nbsp;");
  $("equity").textContent = usd(s.equity);
  $("seed").textContent = "seed: " + usd(s.seed);
  $("pnl").textContent = signed(s.total_pnl); cls($("pnl"), s.total_pnl);
  const pct = 100 * s.total_pnl / s.seed;
  $("pnlpct").textContent = (pct >= 0 ? "+" : "") + pct.toFixed(1) + "%"; cls($("pnlpct"), pct);
  $("lat").textContent = s.latency_ms > 0 ? Math.round(s.latency_ms) + "ms" : "--";
  $("latsub").textContent = s.mode === "LIVE" ? "signal → order ack" : "signal → fill (simulated)";
  $("win").textContent = s.trades ? (100 * s.wins / s.trades).toFixed(1) + "%" : "--";
  $("wl").textContent = `${s.wins}W / ${s.losses}L · ${s.missed} missed`;
  $("spot").textContent = s.spot ? usd(s.spot) : "--";
  $("strike").textContent = s.strike ? usd(s.strike) : "--";
  $("mid").textContent = s.clob_mid ? s.clob_mid.toFixed(3) : "--";
  $("fair").textContent = s.fair ? s.fair.toFixed(3) : "--";
  $("edge").textContent = s.fair ? (s.edge >= 0 ? "+" : "") + (s.edge * 100).toFixed(1) + "c" : "--";
  $("daily").textContent = signed(s.daily_pnl); cls($("daily"), s.daily_pnl);
  $("risk").textContent = (s.risk_used * 100).toFixed(0) + "%";
  $("fees").textContent = usd(s.fees_paid);
  $("mkt").innerHTML = s.market ? `${esc(s.market)}<b>${Math.round(s.secs_left)}s left</b>` : "no active market";
  const c = s.equity_curve;
  $("span").textContent = c.length > 1 ? dur(c[c.length - 1][0] - c[0][0]) : "";
  draw(c);
  $("log").innerHTML = s.log.length ? s.log.map(l =>
    `<div class="row k-${l.kind}"><span class="t">${new Date(l.ts_ms).toISOString().slice(11, 19)}</span>${esc(l.text)}</div>`).join("")
    : '<div class="empty">no activity yet</div>';
}

async function tick() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    const mode = $("mode"); mode.textContent = "OFFLINE"; mode.className = "badge OFFLINE";
  }
}
window.addEventListener("resize", () => last && draw(last.equity_curve));
tick(); setInterval(tick, 500);
</script>
</body>
</html>
