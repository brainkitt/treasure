[package]
name = "polyarb"
version = "0.1.0"
edition = "2024"
description = "Polymarket BTC up/down latency-arbitrage bot (paper + live)"
publish = false

[dependencies]
polymarket-client-sdk = { version = "0.4.4", features = ["clob", "gamma", "ws", "rtds"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
